<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a game · Arcade</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/home.css">
</head>
<body class="home-page">
    <header class="top-bar">
        <span class="player-tag">PLAYER: <strong id="player-name">...</strong></span>
        <button type="button" id="logout-button">LOG OUT</button>
    </header>

    <h1>ARCADE</h1>
    <p class="subtitle">SELECT YOUR GAME</p>

    <main>
        <ul id="game-list" class="game-list" aria-label="Games">
            <!-- Filled in by home.js from /api/games -->
        </ul>
        <p id="home-error" role="alert"></p>
    </main>

    <script type="module" src="/home.js"></script>
</body>
</html>
